<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scheda TEST1</title>
</head>
<body>
    <h1>Inserisci Dati</h1>

    <label for="nome">Nome:</label><br>
    <input type="text" id="nome"><br><br>
    <label for="cognome">Cognome:</label><br>
    <input type="text" id="cognome"><br><br>
    <label for="dataNascita">Data di nascita:</label><br>
    <input type="date" id="dataNascita" onchange="calcolaEta()"><br><br>
    <label for="eta">Età:</label><br>
    <input type="number" id="eta" readonly><br><br>
    <label for="indirizzo">Indirizzo:</label><br>
    <input type="text" id="indirizzo"><br><br>
    <label>Sesso:</label><br>
    <input type="radio" id="sessoM" name="sesso" value="M" checked>
    <label for="sessoM">M</label>
    <input type="radio" id="sessoF" name="sesso" value="F">
    <label for="sessoF">F</label>
    <input type="radio" id="sessoAltro" name="sesso" value="Altro">
    <label for="sessoAltro">Altro</label>
    <br><br>
    <label>Materie preferite:</label><br>
    <input type="checkbox" name="materie" value="Informatica"> Informatica<br>
    <input type="checkbox" name="materie" value="Sistemi e Reti"> Sistemi e Reti<br>
    <input type="checkbox" name="materie" value="Matematica"> Matematica<br>
    <input type="checkbox" name="materie" value="Inglese"> Inglese<br>
    <input type="checkbox" name="materie" value="Storia"> Storia<br>
    <br>
    <button onclick="aggiungiDati()">Aggiungi alla tabella</button>
    <hr>


    
    <h2>Tabella Anagrafica</h2>
    <table border="1" id="tabellaAnagrafica">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Data di nascita</th>
                <th>Età</th>
                <th>Indirizzo</th>
                <th>Sesso</th>
                <th>Materie preferite</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
    <script>
        function calcolaEta() {
            let nascita = new Date(document.getElementById("dataNascita").value);
            let oggi = new Date();
            let anni = (oggi - nascita) / (1000 * 60 * 60 * 24 * 365);
            document.getElementById("eta").value = Math.floor(anni);
        }
        function leggiCheckbox() {
            let checkbox = document.getElementsByName("materie");
            let materie = [];
            for (let i = 0; i < checkbox.length; i++) {
                if (checkbox[i].checked) {
                    materie.push(checkbox[i].value);
                }
            }
            return materie.join(", ");
        }
        function aggiungiCella(riga, testo) {
            let cella = document.createElement("td");
            cella.textContent = testo;
            riga.appendChild(cella);
        }
        function aggiungiDati() {
            let riga = document.createElement("tr");
            aggiungiCella(riga, document.getElementById("nome").value);
            aggiungiCella(riga, document.getElementById("cognome").value);
            aggiungiCella(riga, document.getElementById("dataNascita").value);
            aggiungiCella(riga, document.getElementById("eta").value);
            aggiungiCella(riga, document.getElementById("indirizzo").value);
            aggiungiCella(riga, document.querySelector('input[name="sesso"]:checked').value);
            aggiungiCella(riga, leggiCheckbox());
            document.getElementById("tabellaAnagrafica").tBodies[0].appendChild(riga);
            document.getElementById("nome").value = "";
            document.getElementById("cognome").value = "";
            document.getElementById("dataNascita").value = "";
            document.getElementById("eta").value = "";
            document.getElementById("indirizzo").value = "";
            document.getElementById("sessoM").checked = true;
            let checkbox = document.getElementsByName("materie");
            for (let i = 0; i < checkbox.length; i++) {
                checkbox[i].checked = false;
            }
        }
    </script>
</body>
</html>
